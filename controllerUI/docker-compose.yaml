version: '3.8'

services:
  app:
    image: node:22-alpine
    container_name: my-ts-app
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && npm run build && npm run start"
